<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Checkout Page</title>
</head>

<body>
    <h1>Checkout</h1>
    <section>
        <h2>Your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="A Puzzule Cube">
    </section>
    <p>A Puzzule Cube</p>
    <section>
        <h2>Payment Information</h2>
        <form>
            <label id="card">Card Holder Name:
                <input type="text" name="card-name" id="card-name" required>
                <span aria-hidden="true">*</span>
            </label>
        </form>

        <form>
            <label id="number">Card Holder Number:
                <input type="text" name="card-number" id="card-number" aria-describedby="card-number-help" required>
                <span aria-hidden="true">*</span>
            </label>
            <p id="card-number-help">Please enter your 16-digit card number without spaces or dashes.</p>
        </form>


    </section>
</body>

</html>
